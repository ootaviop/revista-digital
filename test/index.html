        <foreignObject

          <div
            class="revista-tabela-container"
            xmlns="http://www.w3.org/1999/xhtml"
          >
            <h4 class="revista-tabela-titulo">
              Descrição das habilidades no referencial curricular do estado
            </h4>
            <table class="revista-tabela tp-1">
              <tbody>
                <!-- Linha 1: 1EF/2EF -->
                <tr class="linha-1">
                  <td class="col-anos">1EF<br />2EF</td>
                  <td class="col-letra">I</td>
                  <td class="col-descricao">
                    <strong class="codigo-bncc">(EF12LP04)</strong> Ler e
                    compreender, em colaboração com os colegas e com a ajuda do
                    professor ou já com certa autonomia, listas, agendas,
                    calendários, avisos, convites, receitas, instruções de
                    montagem (digitais ou impressas), dentre outros gêneros do
                    campo da vida cotidiana, considerando a situação
                    comunicativa e o tema/assunto do texto e relacionando sua
                    forma de organização à sua finalidade.
                  </td>
                </tr>

                <!-- Linha 2: 3EF -->
                <tr class="linha-2">
                  <td class="col-anos">3EF</td>
                  <td class="col-letra">A</td>
                  <td class="col-descricao">
                    <strong class="codigo-bncc">(EF03LP12)</strong> Ler e
                    compreender, com autonomia, cartas pessoais e diários, com
                    expressão de sentimentos e opiniões, dentre outros gêneros
                    do campo da vida cotidiana, de acordo com as convenções do
                    gênero carta e considerando a situação comunicativa e o
                    tema/assunto do texto.
                  </td>
                </tr>

                <!-- Linha 3: 4EF -->
                <tr class="linha-3">
                  <td class="col-anos">4EF</td>
                  <td class="col-letra">A</td>
                  <td class="col-descricao">
                    <strong class="codigo-bncc">(EF04LP09)</strong> Ler e
                    compreender, com autonomia, cartas pessoais de reclamação,
                    dentre outros gêneros do campo da vida cotidiana, de acordo
                    com as convenções do gênero carta e considerando a situação
                    comunicativa e o tema/ assunto/finalidade do texto.
                  </td>
                </tr>

                <!-- Linha 4: 5EF -->
                <tr class="linha-4">
                  <td class="col-anos">5EF</td>
                  <td class="col-letra">A</td>
                  <td class="col-descricao">
                    <strong class="codigo-bncc">(EF05LP04)</strong> Ler e
                    compreender, com autonomia, anedotas, piadas e cartuns,
                    dentre outros gêneros do campo da vida cotidiana, de acordo
                    com as convenções do gênero e considerando a situação
                    comunicativa e a finalidade do texto.
                  </td>
                </tr>

                <!-- Linha 5: 6 ao 9EF -->
                <tr class="linha-5">
                  <td class="col-anos">6 ao<br />9EF</td>
                  <td class="col-letra">C</td>
                  <td class="col-descricao">
                    <strong class="codigo-bncc">(EF69LP03)</strong> Identificar,
                    em notícias, o fato central, suas principais circunstâncias
                    e eventuais decorrências; em reportagens e fotorreportagens
                    o fato ou a temática retratada e a perspectiva de abordagem,
                    em entrevistas os principais temas/ subtemas abordados,
                    explicações dadas ou teses defendidas em relação a esses
                    subtemas; em tirinhas, memes, charge, a crítica, ironia ou
                    humor presente.
                  </td>
                </tr>

                <!-- Linha 6: EM -->
                <tr class="linha-6">
                  <td class="col-anos">EM</td>
                  <td class="col-letra">R</td>
                  <td class="col-descricao">
                    <strong class="codigo-bncc">(EM13LPG3)</strong> Analisar,
                    discutir, produzir e socializar, tendo em vista temas e
                    acontecimentos de interesse local ou global, notícias,
                    fotodenúncias, fotorreportagens, reportagens
                    multimidiáticas, documentários, infográficos, podcasts
                    noticiosos, entrevistas, cartas de leitor (revista, jornal
                    ou mídia digital), comentários, artigos de opinião de cunho
                    analítico e/ou argumentativo, resenhas críticas e vídeos de
                    opinião e apreciação de produções culturais (resenhas,
                    ensaios etc.) e podcasts culturais, gamecast etc., em várias
                    mídias, vivenciando de forma significativa o papel de
                    repórter, analista, crítico/a, editorialista ou articulista,
                    leitor, vlogueiro e booktuber, entre outros.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
