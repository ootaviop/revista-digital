          <div xmlns="http://www.w3.org/1999/xhtml">
            <h4>
              Descrição das habilidades no referencial curricular do estado
            </h4>
            <div class="table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>ANO</th>
                    <th>ETAPA</th>
                    <th>HABILIDADE</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>1EF-2EF</td>
                    <td>I</td>
                    <td>
                      (EF12LP04) Ler e compreender, em colaboração com os
                      colegas e com a ajuda do professor ou já com certa
                      autonomia, listas, agendas, calendários, avisos, convites,
                      receitas, instruções de montagem (digitais ou impressos),
                      dentre outros gêneros do campo da vida cotidiana,
                      considerando a situação comunicativa e o tema/assunto do
                      texto e relacionando sua forma de organização à sua
                      finalidade.
                    </td>
                  </tr>
                  <tr>
                    <td>3EF</td>
                    <td>A</td>
                    <td>
                      (EF03LP12) Ler e compreender, com autonomia, cartas
                      pessoais e diários, com expressão de sentimentos e
                      opiniões, dentre outros gêneros do campo da vida
                      cotidiana, de acordo com as convenções do gênero carta e
                      considerando a situação comunicativa e o tema/assunto do
                      texto.
                    </td>
                  </tr>
                  <tr>
                    <td>4EF</td>
                    <td>A</td>
                    <td>
                      (EF04LP10) Ler e compreender, com autonomia, cartas
                      pessoais de reclamação, dentre outros gêneros do campo da
                      vida cotidiana, de acordo com as convenções do gênero
                      carta e considerando a situação comunicativa e o
                      tema/assunto/finalidade do texto.
                    </td>
                  </tr>
                  <tr>
                    <td>5EF</td>
                    <td>A</td>
                    <td>
                      (EF05LP10) Ler e compreender, com autonomia, anedotas,
                      piadas e cartuns, dentre outros gêneros do campo da vida
                      cotidiana, de acordo com as convenções do gênero e
                      considerando a situação comunicativa e a finalidade do
                      texto.
                    </td>
                  </tr>
                  <tr>
                    <td>6-9EF</td>
                    <td>C</td>
                    <td>
                      (EF69LP03) Identificar, em notícias, o fato central, suas
                      principais circunstâncias e eventuais decorrências; em
                      reportagens e fotorreportagens o fato ou a temática
                      retratada e a perspectiva de abordagem, em entrevistas os
                      principais temas/ subtemas abordados, explicações dadas ou
                      teses defendidas em relação a esses subtemas; em tirinhas,
                      memes, charge, a crítica, ironia ou humor presente.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
