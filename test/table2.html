<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/table2.css" />
  </head>
  <body>
  <div class="revista-tabela-anos-container">
    <table class="revista-tabela-anos">
      <thead>
        <tr>
          <th>2022</th>
          <th>2023</th>
          <th>2024</th>
          <th>2025</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="valor-medio">58%</td>
          <td class="valor-medio">60%</td>
          <td class="valor-medio">60%</td>
          <td class="valor-indefinido">?</td>
        </tr>
      </tbody>
    </table>

    <div class="revista-tabela-legenda">
      <div class="legenda-item">
        <span class="legenda-circulo vermelho"></span>
        <span class="legenda-texto">Até 40%</span>
      </div>
      <div class="legenda-item">
        <span class="legenda-circulo laranja"></span>
        <span class="legenda-texto">De 41% até 60%</span>
      </div>
      <div class="legenda-item">
        <span class="legenda-circulo azul-claro"></span>
        <span class="legenda-texto">De 61% até 80%</span>
      </div>
      <div class="legenda-item">
        <span class="legenda-circulo azul-escuro"></span>
        <span class="legenda-texto">Acima de 81%</span>
      </div>
    </div>
  </div>
  </body>
</html>
